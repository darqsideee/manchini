<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ MANCHINI | Official Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00f2ea; /* Cyan */
            --secondary: #ff0050; /* Neon Red/Pink */
            --bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --glass: rgba(20, 20, 20, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 242, 234, 0.1) 0%, transparent 20%),
                              radial-gradient(circle at 90% 80%, rgba(255, 0, 80, 0.1) 0%, transparent 20%);
        }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 10px var(--primary); } 50% { box-shadow: 0 0 20px var(--primary), 0 0 10px var(--secondary); } 100% { box-shadow: 0 0 10px var(--primary); } }

        .anim-entry { animation: fadeIn 0.8s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }

        /* --- Typography & Layout --- */
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 2px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* --- Hero Section --- */
        header {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }
        
        h1 { font-size: 3.5rem; text-shadow: 0 0 20px var(--primary); margin-bottom: 10px; }
        .subtitle { font-size: 1.2rem; color: #ccc; margin-bottom: 30px; }
        
        .cta-btn {
            padding: 15px 40px;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
            cursor: pointer;
            border-radius: 50px;
        }
        .cta-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); }

        /* --- Sections --- */
        section { padding: 60px 0; border-bottom: 1px solid #222; }
        .section-title { text-align: center; font-size: 2rem; margin-bottom: 40px; color: var(--secondary); }

        /* --- Calendar Grid --- */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .event-card {
            background: var(--card-bg);
            border-left: 4px solid var(--secondary);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s;
        }
        .event-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.08); }
        .event-date { font-weight: bold; color: var(--primary); font-size: 1.1rem; }
        .event-img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; margin-top: 10px; display: none; } 
        .event-img.show { display: block; }

        /* --- Request Form --- */
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        input, select {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            border-radius: 5px;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: var(--primary); }
        button.submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--secondary);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
        }

        /* --- Footer --- */
        footer { padding: 40px 20px; text-align: center; font-size: 0.9rem; color: #666; }
        .social-links a { color: white; font-size: 1.5rem; margin: 0 10px; transition: color 0.3s; }
        .social-links a:hover { color: var(--primary); }
        #admin-trigger { cursor: pointer; margin-top: 20px; display: inline-block; font-size: 0.8rem; }

        /* --- ADMIN PANEL --- */
        #admin-panel {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #333; }
        .close-admin { color: red; cursor: pointer; font-size: 1.5rem; }
        
        .request-list-item {
            background: #111;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }
        .request-list-item.fav { border-color: gold; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        .req-actions button { margin-left: 5px; padding: 5px 10px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-fav { background: gold; color: black; }
        .btn-del { background: red; color: white; }
        .req-info a { color: var(--primary); text-decoration: none; font-size: 0.8rem; }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .request-list-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .req-actions { width: 100%; display: flex; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <header>
        <div class="anim-entry">
            <h1>DJ MANCHINI</h1>
            <p class="subtitle">Sound Engineer & Professional DJ</p>
            <a href="#request" class="cta-btn delay-1">ZAHRÁT PÍSNIČKU</a>
        </div>
    </header>

    <section id="calendar">
        <div class="container">
            <h2 class="section-title anim-entry">KALENDÁŘ AKCÍ</h2>
            <div id="events-container" class="calendar-grid">
                <div class="event-card anim-entry delay-2">
                    <p>Načítám akce...</p>
                </div>
            </div>
        </div>
    </section>

    <section id="request">
        <div class="container">
            <h2 class="section-title anim-entry">SONG ON WISH</h2>
            <div class="form-container anim-entry delay-2">
                <form id="song-request-form">
                    <label>Tvoje jméno</label>
                    <input type="text" id="req-name" placeholder="Např. Lukáš" required>
                    
                    <label>Interpret</label>
                    <input type="text" id="req-artist" placeholder="Např. Avicii" required>
                    
                    <label>Název skladby</label>
                    <input type="text" id="req-song" placeholder="Např. Levels" required>
                    
                    <label>Spotify / YouTube Link (volitelné)</label>
                    <input type="url" id="req-link" placeholder="https://...">
                    
                    <button type="submit" class="submit-btn">ODESLAT DJOVI <i class="fas fa-paper-plane"></i></button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-spotify"></i></a>
            <a href="mailto:darqsidee@gmail.com"><i class="fas fa-envelope"></i></a>
        </div>
        <p style="margin-top:20px;">&copy; 2025 DJ MANCHINI</p>
        
        <div id="admin-trigger">DJ Login <i class="fas fa-lock"></i></div>
    </footer>

    <div id="admin-panel">
        <div class="container">
            <div class="admin-header">
                <h2>DJ PANEL</h2>
                <div class="close-admin" id="close-admin-btn"><i class="fas fa-times"></i> Zavřít</div>
            </div>
            
            <div style="margin-bottom: 40px; border-bottom: 1px solid #333; padding-bottom: 20px;">
                <h3>Přidat akci do kalendáře</h3>
                <form id="add-event-form" style="margin-top: 15px;">
                    <input type="text" id="event-title" placeholder="Název akce" required>
                    <input type="date" id="event-date" required>
                    <input type="text" id="event-desc" placeholder="Popis (místo, čas...)">
                    <input type="url" id="event-img" placeholder="URL obrázku (volitelné)">
                    <button type="submit" class="cta-btn" style="background: var(--primary); color: black;">PŘIDAT AKCI</button>
                </form>
            </div>

            <h3>Žádosti o písničky</h3>
            <div id="admin-requests-list">
                </div>
            
            <button id="logout-btn" style="margin-top: 30px; background: red; border: none; color: white; padding: 10px 20px; border-radius: 5px;">Odhlásit se</button>
        </div>
    </div>

    <script type="module">
        // Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-analytics.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

        // Konfigurace
        const firebaseConfig = {
            apiKey: "AIzaSyBV9h5nozB1rD6uGMI3h4TqCJ7WvKh6zFQ",
            authDomain: "manchini-a5042.firebaseapp.com",
            databaseURL: "https://manchini-a5042-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "manchini-a5042",
            storageBucket: "manchini-a5042.firebasestorage.app",
            messagingSenderId: "332521194892",
            appId: "1:332521194892:web:a4fe9ef402f8cc8e2082a9",
            measurementId: "G-EX4WXE3Q7R"
        };

        // Initialize
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        // --- PUBLIC: SONG REQUEST ---
        const requestForm = document.getElementById('song-request-form');
        requestForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('req-name').value;
            const artist = document.getElementById('req-artist').value;
            const song = document.getElementById('req-song').value;
            const link = document.getElementById('req-link').value;

            push(ref(db, 'requests'), {
                name: name,
                artist: artist,
                song: song,
                link: link,
                status: 'pending', // pending, favorite
                timestamp: Date.now()
            }).then(() => {
                alert("✅ Písnička odeslána DJovi!");
                requestForm.reset();
            }).catch((error) => {
                console.error(error);
                alert("Chyba při odesílání.");
            });
        });

        // --- PUBLIC: LOAD EVENTS ---
        const eventsContainer = document.getElementById('events-container');
        onValue(ref(db, 'events'), (snapshot) => {
            eventsContainer.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                // Převod objektu na pole a seřazení podle data
                const eventsArray = Object.values(data).sort((a, b) => new Date(a.date) - new Date(b.date));
                
                eventsArray.forEach(event => {
                    // Formátování data
                    const dateObj = new Date(event.date);
                    const dateStr = dateObj.toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long' });

                    const div = document.createElement('div');
                    div.className = 'event-card anim-entry';
                    div.innerHTML = `
                        <div class="event-date">${dateStr}</div>
                        <h3>${event.title}</h3>
                        <p>${event.desc}</p>
                        ${event.img ? `<img src="${event.img}" class="event-img show" alt="Event">` : ''}
                    `;
                    eventsContainer.appendChild(div);
                });
            } else {
                eventsContainer.innerHTML = '<p style="color:#666">Žádné nadcházející akce.</p>';
            }
        });

        // --- ADMIN: LOGIN LOGIC ---
        const adminTrigger = document.getElementById('admin-trigger');
        const adminPanel = document.getElementById('admin-panel');
        const closeAdminBtn = document.getElementById('close-admin-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const ALLOWED_EMAIL = "darqsidee@gmail.com";

        adminTrigger.addEventListener('click', () => {
            if (!auth.currentUser) {
                signInWithPopup(auth, provider)
                    .then((result) => {
                        const user = result.user;
                        if (user.email === ALLOWED_EMAIL) {
                            adminPanel.style.display = "block";
                            loadAdminData();
                        } else {
                            alert("Nemáte oprávnění pro přístup do DJ panelu.");
                            signOut(auth);
                        }
                    }).catch((error) => console.error(error));
            } else {
                if(auth.currentUser.email === ALLOWED_EMAIL) {
                    adminPanel.style.display = "block";
                }
            }
        });

        // Close Admin Panel
        closeAdminBtn.addEventListener('click', () => {
            adminPanel.style.display = "none";
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                adminPanel.style.display = "none";
                alert("Odhlášeno.");
            });
        });

        // --- ADMIN: REQUEST MANAGEMENT ---
        function loadAdminData() {
            const adminReqList = document.getElementById('admin-requests-list');
            
            onValue(ref(db, 'requests'), (snapshot) => {
                adminReqList.innerHTML = '';
                const data = snapshot.val();
                if(data) {
                    // Reverse to show newest first
                    Object.entries(data).reverse().forEach(([key, req]) => {
                        const div = document.createElement('div');
                        div.className = `request-list-item ${req.status === 'favorite' ? 'fav' : ''}`;
                        div.innerHTML = `
                            <div class="req-info">
                                <strong>${req.song}</strong> - ${req.artist}<br>
                                <small>Od: ${req.name}</small><br>
                                ${req.link ? `<a href="${req.link}" target="_blank">Odkaz <i class="fas fa-external-link-alt"></i></a>` : ''}
                            </div>
                            <div class="req-actions">
                                <button class="btn-fav" onclick="window.toggleFav('${key}', '${req.status}')"><i class="fas fa-star"></i></button>
                                <button class="btn-del" onclick="window.deleteReq('${key}')"><i class="fas fa-trash"></i></button>
                            </div>
                        `;
                        adminReqList.appendChild(div);
                    });
                } else {
                    adminReqList.innerHTML = '<p>Žádné žádosti.</p>';
                }
            });
        }

        // Global functions for Admin buttons (attached to window because of module scope)
        window.toggleFav = (key, currentStatus) => {
            const newStatus = currentStatus === 'favorite' ? 'pending' : 'favorite';
            update(ref(db, 'requests/' + key), { status: newStatus });
        };

        window.deleteReq = (key) => {
            if(confirm("Smazat tuto žádost?")) {
                remove(ref(db, 'requests/' + key));
            }
        };

        // --- ADMIN: ADD EVENT ---
        const eventForm = document.getElementById('add-event-form');
        eventForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('event-title').value;
            const date = document.getElementById('event-date').value;
            const desc = document.getElementById('event-desc').value;
            const img = document.getElementById('event-img').value;

            push(ref(db, 'events'), {
                title: title,
                date: date,
                desc: desc,
                img: img
            }).then(() => {
                alert("Akce přidána!");
                eventForm.reset();
            });
        });

    </script>
</body>
</html>
