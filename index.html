<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANCHINI | DJ - Zvukař</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/L5DmQxVL/DALL-E-2025-12-06-12-47-51-Design-a-modern-minimalistic-logo-on-a-fully-transparent-background-T.webp"> 
    
    <style>
        :root {
            --primary: #00f2ea; /* Cyan */
            --secondary: #ff0050; /* Neon Red/Pink */
            --bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --glass: rgba(20, 20, 20, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 242, 234, 0.1) 0%, transparent 20%),
                              radial-gradient(circle at 90% 80%, rgba(255, 0, 80, 0.1) 0%, transparent 20%);
            padding-top: 80px; /* Offset for fixed nav */
        }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .anim-entry { animation: fadeIn 0.8s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }

        /* --- Typography --- */
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 2px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* --- NAVIGATION & HAMBURGER --- */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px;
            background: var(--glass); backdrop-filter: blur(10px);
            z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
        }
        .logo { font-family: 'Orbitron'; font-size: 1.5rem; font-weight: bold; color: white; }
        .logo span { color: var(--primary); }

        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { color: white; text-decoration: none; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--primary); }

        .hamburger { display: none; font-size: 1.8rem; color: white; cursor: pointer; }

        /* Mobile Nav */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute; top: 80px; left: 0; width: 100%;
                background: #0a0a0a; flex-direction: column;
                text-align: center; padding: 20px 0; border-bottom: 1px solid #333;
            }
            .nav-links.active { display: flex; animation: fadeIn 0.3s ease; }
            .hamburger { display: block; }
        }

        /* --- Hero Section --- */
        header {
            height: 80vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
        }
        h1 { font-size: 3.5rem; text-shadow: 0 0 20px var(--primary); margin-bottom: 10px; }
        .subtitle { font-size: 1.2rem; color: #ccc; margin-bottom: 30px; }
        
        .cta-btn {
            padding: 15px 40px; background: transparent; border: 2px solid var(--primary);
            color: var(--primary); font-weight: bold; text-decoration: none;
            transition: 0.3s; cursor: pointer; border-radius: 50px;
        }
        .cta-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); }

        /* --- Sections --- */
        section { padding: 60px 0; border-bottom: 1px solid #222; }
        .section-title { text-align: center; font-size: 2rem; margin-bottom: 40px; color: var(--secondary); }

        /* --- CALENDAR INTERACTIVE GRID --- */
        .calendar-wrapper {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 20px;
        }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .cal-btn { background: transparent; border: 1px solid var(--primary); color: var(--primary); width: 35px; height: 35px; border-radius: 50%; cursor: pointer; transition: 0.3s; }
        .cal-btn:hover:not(:disabled) { background: var(--primary); color: black; }
        .cal-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: #555; color: #555; }
        .cal-title { font-size: 1.5rem; font-weight: bold; }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-bottom: 20px; }
        .cal-day-label { text-align: center; color: #666; font-size: 0.8rem; font-weight: bold; }
        
        .day-cell {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.02); border-radius: 8px; cursor: default;
            position: relative; transition: 0.3s;
        }
        /* Den s událostí */
        .day-cell.has-event {
            background: rgba(0, 242, 234, 0.1); border: 1px solid var(--primary);
            color: white; cursor: pointer; font-weight: bold;
        }
        .day-cell.has-event:hover { background: var(--primary); color: black; box-shadow: 0 0 15px var(--primary); }
        .day-cell.active-selected { background: var(--secondary); color: white; border-color: var(--secondary); }

        /* Event Details Box */
        .event-details-box {
            background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px;
            border-left: 4px solid var(--secondary); display: none; margin-top: 20px; animation: fadeIn 0.3s;
        }
        .event-details-box.show { display: block; }

        /* --- Request Form --- */
        .form-container {
            max-width: 600px; margin: 0 auto; background: var(--card-bg);
            padding: 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
        }
        input, select {
            width: 100%; padding: 15px; margin-bottom: 15px; background: #1a1a1a;
            border: 1px solid #333; color: white; border-radius: 5px; font-family: inherit;
        }
        input:focus { outline: none; border-color: var(--primary); }
        button.submit-btn {
            width: 100%; padding: 15px; background: var(--secondary); border: none;
            color: white; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 1.1rem;
        }

        /* --- Footer --- */
        footer { padding: 40px 20px; text-align: center; font-size: 0.9rem; color: #666; }
        .social-links a { color: white; font-size: 1.5rem; margin: 0 10px; transition: color 0.3s; }
        .social-links a:hover { color: var(--primary); }
        #admin-trigger { cursor: pointer; margin-top: 20px; display: inline-block; font-size: 0.8rem; }

        /* --- ADMIN PANEL --- */
        #admin-panel {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000000; z-index: 2000; overflow-y: auto; padding: 20px;
        }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .close-admin { color: red; cursor: pointer; font-size: 1.5rem; }
        .request-list-item {
            background: #111; padding: 15px; margin-bottom: 10px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #333;
        }
        .request-list-item.fav { border-color: gold; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        .req-actions button { margin-left: 5px; padding: 5px 10px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-fav { background: gold; color: black; } 
        .btn-del { background: red; color: white; }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .request-list-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .req-actions { width: 100%; display: flex; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">DJ <span>MANCHINI</span></div>
        <div class="hamburger" id="hamburger-btn"><i class="fas fa-bars"></i></div>
        <ul class="nav-links" id="nav-links">
            <li><a href="#home">Domů</a></li>
            <li><a href="#calendar">Kalendář</a></li>
            <li><a href="#request">Zahrát Song</a></li>
            <li><a href="mailto:darqsidee@gmail.com">Kontakt</a></li>
        </ul>
    </nav>

    <header id="home">
        <div class="anim-entry">
            <h1>DJ MANCHINI</h1>
            <p class="subtitle">Sound Engineer & Professional DJ</p>
            <a href="#request" class="cta-btn delay-1">ZAHRÁT PÍSNIČKU</a>
        </div>
    </header>

    <section id="calendar">
        <div class="container">
            <h2 class="section-title anim-entry">KALENDÁŘ AKCÍ</h2>
            
            <div class="calendar-wrapper anim-entry delay-2">
                <div class="cal-header">
                    <button class="cal-btn" id="prev-month"><i class="fas fa-chevron-left"></i></button>
                    <div class="cal-title" id="cal-month-label">...</div>
                    <button class="cal-btn" id="next-month"><i class="fas fa-chevron-right"></i></button>
                </div>

                <div class="cal-grid" style="margin-bottom:10px;">
                    <div class="cal-day-label">PO</div>
                    <div class="cal-day-label">ÚT</div>
                    <div class="cal-day-label">ST</div>
                    <div class="cal-day-label">ČT</div>
                    <div class="cal-day-label">PÁ</div>
                    <div class="cal-day-label">SO</div>
                    <div class="cal-day-label">NE</div>
                </div>

                <div class="cal-grid" id="cal-days-container"></div>

                <div id="event-detail-panel" class="event-details-box">
                    <h3 id="detail-title" style="color:var(--primary); margin-bottom:10px;"></h3>
                    <div style="font-size:0.9rem; color:#ccc;" id="detail-date"></div>
                    <p id="detail-desc" style="margin-top:10px;"></p>
                    <img id="detail-img" src="" style="width:100%; max-width:300px; margin-top:15px; border-radius:5px; display:none;">
                </div>
            </div>
        </div>
    </section>

    <section id="request">
        <div class="container">
            <h2 class="section-title anim-entry">SONG ON WISH</h2>
            <div class="form-container anim-entry delay-2">
                <form id="song-request-form">
                    <label>Tvoje jméno</label>
                    <input type="text" id="req-name" placeholder="Např. Lukáš" required>
                    <label>Interpret</label>
                    <input type="text" id="req-artist" placeholder="Např. Avicii" required>
                    <label>Název skladby</label>
                    <input type="text" id="req-song" placeholder="Např. Levels" required>
                    <label>Spotify / YouTube Link (volitelné)</label>
                    <input type="url" id="req-link" placeholder="https://...">
                    <button type="submit" class="submit-btn">ODESLAT DJOVI <i class="fas fa-paper-plane"></i></button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-spotify"></i></a>
            <a href="mailto:darqsidee@gmail.com"><i class="fas fa-envelope"></i></a>
        </div>
        <p style="margin-top:20px;">&copy; 2025 DJ MANCHINI</p>
        <div id="admin-trigger">DJ Login <i class="fas fa-lock"></i></div>
    </footer>

    <div id="admin-panel">
        <div class="container">
            <div class="admin-header">
                <h2>DJ PANEL</h2>
                <div class="close-admin" id="close-admin-btn"><i class="fas fa-times"></i> Zavřít</div>
            </div>
            
            <div style="margin-bottom: 40px; border-bottom: 1px solid #333; padding-bottom: 20px;">
                <h3>Přidat akci do kalendáře</h3>
                <form id="add-event-form" style="margin-top: 15px;">
                    <input type="text" id="event-title" placeholder="Název akce" required>
                    <input type="date" id="event-date" required>
                    <input type="text" id="event-desc" placeholder="Popis (místo, čas...)">
                    <input type="url" id="event-img" placeholder="URL obrázku (volitelné)">
                    <button type="submit" class="cta-btn" style="background: var(--primary); color: black;">PŘIDAT AKCI</button>
                </form>
            </div>

            <h3>Žádosti o písničky</h3>
            <div id="admin-requests-list"></div>
            <button id="logout-btn" style="margin-top: 30px; background: red; border: none; color: white; padding: 10px 20px; border-radius: 5px;">Odhlásit se</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBV9h5nozB1rD6uGMI3h4TqCJ7WvKh6zFQ",
            authDomain: "manchini-a5042.firebaseapp.com",
            databaseURL: "https://manchini-a5042-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "manchini-a5042",
            storageBucket: "manchini-a5042.firebasestorage.app",
            messagingSenderId: "332521194892",
            appId: "1:332521194892:web:a4fe9ef402f8cc8e2082a9",
            measurementId: "G-EX4WXE3Q7R"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        // --- HAMBURGER MENU LOGIC ---
        const hamburger = document.getElementById('hamburger-btn');
        const navLinks = document.getElementById('nav-links');
        
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // Click on link closes menu
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
            });
        });

        // --- CALENDAR LOGIC (Interactive with Limits) ---
        let currentDate = new Date();
        const initialDate = new Date(); // To know "today" and prevent past scrolling if needed
        const maxFutureMonths = 2; // Limit: Current + 2 months
        let eventsData = {};

        const monthNames = ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"];

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('cal-month-label').innerText = `${monthNames[month]} ${year}`;

            // Buttons Logic
            const prevBtn = document.getElementById('prev-month');
            const nextBtn = document.getElementById('next-month');

            // Limit Prev: Can't go before current month (optional, depends on preference)
            const isSameMonthAsToday = initialDate.getMonth() === month && initialDate.getFullYear() === year;
            // Uncomment next line if you want to block past months
            // prevBtn.disabled = isSameMonthAsToday; 

            // Limit Next: Max 2 months ahead
            const futureLimit = new Date(initialDate);
            futureLimit.setMonth(initialDate.getMonth() + maxFutureMonths);
            
            // Compare years and months to see if we reached the limit
            if (year > futureLimit.getFullYear() || (year === futureLimit.getFullYear() && month >= futureLimit.getMonth())) {
                nextBtn.disabled = true;
            } else {
                nextBtn.disabled = false;
            }

            const daysContainer = document.getElementById('cal-days-container');
            daysContainer.innerHTML = "";

            const firstDayIndex = new Date(year, month, 1).getDay(); // 0 = Sun
            const adjustedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1; // 0 = Mon
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Empty cells
            for(let i=0; i<adjustedFirstDay; i++) {
                daysContainer.innerHTML += `<div></div>`;
            }

            // Days
            for(let d=1; d<=daysInMonth; d++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-cell';
                dayDiv.innerText = d;
                
                const dateKey = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                
                // Find event
                let event = null;
                if(eventsData) {
                    Object.values(eventsData).forEach(ev => {
                        if(ev.date === dateKey) event = ev;
                    });
                }

                if(event) {
                    dayDiv.classList.add('has-event');
                    dayDiv.addEventListener('click', () => {
                        // Show details
                        document.querySelectorAll('.day-cell').forEach(c => c.classList.remove('active-selected'));
                        dayDiv.classList.add('active-selected');
                        
                        const detailPanel = document.getElementById('event-detail-panel');
                        detailPanel.classList.add('show');
                        document.getElementById('detail-title').innerText = event.title;
                        document.getElementById('detail-date').innerText = `${d}. ${monthNames[month]} ${year}`;
                        document.getElementById('detail-desc').innerText = event.desc || "";
                        
                        const imgEl = document.getElementById('detail-img');
                        if(event.img) {
                            imgEl.src = event.img;
                            imgEl.style.display = 'block';
                        } else {
                            imgEl.style.display = 'none';
                        }
                    });
                }

                daysContainer.appendChild(dayDiv);
            }
        }

        document.getElementById('prev-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('next-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        // Load Events from Firebase
        onValue(ref(db, 'events'), (snapshot) => {
            eventsData = snapshot.val() || {};
            renderCalendar();
        });

        // --- SONG REQUEST ---
        const requestForm = document.getElementById('song-request-form');
        requestForm.addEventListener('submit', (e) => {
            e.preventDefault();
            push(ref(db, 'requests'), {
                name: document.getElementById('req-name').value,
                artist: document.getElementById('req-artist').value,
                song: document.getElementById('req-song').value,
                link: document.getElementById('req-link').value,
                status: 'pending',
                timestamp: Date.now()
            }).then(() => {
                alert("✅ Písnička odeslána!");
                requestForm.reset();
            });
        });

        // --- ADMIN AUTH ---
        const adminTrigger = document.getElementById('admin-trigger');
        const adminPanel = document.getElementById('admin-panel');
        const ALLOWED_EMAIL = "darqsidee@gmail.com";

        adminTrigger.addEventListener('click', () => {
            if (!auth.currentUser) {
                signInWithPopup(auth, provider).then((result) => {
                    if (result.user.email === ALLOWED_EMAIL) {
                        adminPanel.style.display = "block";
                        loadAdminData();
                    } else {
                        alert("Přístup zamítnut.");
                        signOut(auth);
                    }
                });
            } else if (auth.currentUser.email === ALLOWED_EMAIL) {
                adminPanel.style.display = "block";
                loadAdminData();
            }
        });

        document.getElementById('close-admin-btn').addEventListener('click', () => adminPanel.style.display = "none");
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth).then(() => adminPanel.style.display = "none"));

        // --- ADMIN DATA ---
        function loadAdminData() {
            const list = document.getElementById('admin-requests-list');
            onValue(ref(db, 'requests'), (snapshot) => {
                list.innerHTML = '';
                const data = snapshot.val();
                if(data) {
                    Object.entries(data).reverse().forEach(([key, req]) => {
                        const div = document.createElement('div');
                        div.className = `request-list-item ${req.status === 'favorite' ? 'fav' : ''}`;
                        div.innerHTML = `
                            <div>
                                <strong>${req.song}</strong> - ${req.artist}<br>
                                <small>${req.name}</small>
                            </div>
                            <div class="req-actions">
                                <button class="btn-fav" onclick="window.toggleFav('${key}', '${req.status}')"><i class="fas fa-star"></i></button>
                                <button class="btn-del" onclick="window.deleteReq('${key}')"><i class="fas fa-trash"></i></button>
                            </div>
                        `;
                        list.appendChild(div);
                    });
                }
            });
        }

        document.getElementById('add-event-form').addEventListener('submit', (e) => {
            e.preventDefault();
            push(ref(db, 'events'), {
                title: document.getElementById('event-title').value,
                date: document.getElementById('event-date').value,
                desc: document.getElementById('event-desc').value,
                img: document.getElementById('event-img').value
            }).then(() => { alert("Uloženo!"); e.target.reset(); });
        });

        // Global functions
        window.toggleFav = (k, s) => update(ref(db, 'requests/'+k), { status: s === 'favorite' ? 'pending' : 'favorite' });
        window.deleteReq = (k) => { if(confirm("Smazat?")) remove(ref(db, 'requests/'+k)); };

    </script>
</body>
</html>
